<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="light"><title>Admin – HostelAlloc</title><link rel="stylesheet" href="style.css"></head><body><header id="hd"></header>
<main class="wrap pg"><h1 style="margin:0 0 24px;max-width:none;font-size:clamp(26px,5vw,36px)">Admin dashboard</h1>
<div class="stats" id="st"></div>
<h3>Applications</h3><div class="tw" style="margin:10px 0 28px"><table><thead><tr><th>Student</th><th>Hostel</th><th>Status</th><th>Allocation</th><th>Action</th></tr></thead><tbody id="tb"></tbody></table></div>
<h3>Occupancy</h3><div class="grid" id="oc" style="margin-top:10px"></div></main>
<footer id="ft"></footer><script src="app.js"></script>
<script>
const u=guard('admin');
function render(){const A=apps(),tt=H.reduce((s,h)=>s+total(h),0),ub=H.reduce((s,h)=>s+used(h.id),0),c=s=>A.filter(a=>a.status===s).length;
st.innerHTML=[['Applications',A.length],['Pending',c('Pending')],['Approved',c('Approved')],['Beds free',tt-ub]].map(x=>'<div class="stat"><b>'+x[1]+'</b><small>'+x[0]+'</small></div>').join('');
tb.innerHTML=A.length?A.map(a=>'<tr><td>'+a.name+'<br><small class="m">'+(a.matric||'')+'</small></td><td>'+H.find(h=>h.id===a.hid).name+'</td><td><span class="badge '+a.status+'">'+a.status+'</span></td><td>'+(a.status==='Approved'?'Room '+a.room+', Bed '+a.bed:'—')+'</td><td>'+(a.status==='Pending'?'<button class="btn sm" onclick="ok('+a.id+')">Approve</button> <button class="btn ghost sm" onclick="no('+a.id+')">Reject</button>':'')+'</td></tr>').join(''):'<tr><td colspan="5" class="m">No applications yet. Log in as a student to submit one.</td></tr>';
oc.innerHTML=H.map(h=>'<div class="card"><div class="row"><h3>'+h.name+'</h3><span class="badge">'+h.type+'</span></div><div class="bar"><i style="width:'+Math.round(used(h.id)/total(h)*100)+'%"></i></div><p class="m" style="margin:0">'+used(h.id)+' / '+total(h)+' beds occupied</p></div>').join('')}
function ok(id){approve(id);render()}
function no(id){const A=apps();A.find(x=>x.id===id).status='Rejected';db.set('apps',A);render()}
if(u)render();
</script></body></html>
